name: quran_tutor_mvp
description: Cross-platform Quran tutor MVP with mock AI recitation analysis.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  http: ^1.2.2
  record: ^7.1.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
